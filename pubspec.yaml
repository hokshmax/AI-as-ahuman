name: ai_as_ahuman
description: >
  Voice-controlled AI agent built with Flutter and the Gemini Live API.
  Gemini listens over voice, watches the screen, and drives the mouse
  and keyboard like a human operator would.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Realtime voice <-> Gemini Live API
  web_socket_channel: ^2.4.0
  flutter_sound: ^9.28.0
  logger: ^2.4.0 # for flutter_sound's verbose logLevel
  permission_handler: ^11.3.1 # Windows only, see AudioService
  flutter_macos_permissions: ^2.1.0 # macOS mic + screen recording

  # Screen vision
  screen_capturer: ^0.2.3
  screen_retriever: ^0.2.0
  image: ^4.2.0

  # State + utils
  provider: ^6.1.2
  path_provider: ^2.1.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
